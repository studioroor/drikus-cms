# Fly.io: `fly launch --copy-config --no-deploy -c deploy/fly.toml`, then
# `fly volumes create drikus_data --size 1` and `fly deploy --ha=false -c deploy/fly.toml`.
# SQLite is a file on one volume: keep exactly ONE machine and ONE volume.
# Without --ha=false the first deploy adds a second machine with its own,
# empty database. Check with `fly machines list` and `fly volumes list`.
# GitHub App secrets: `fly secrets set GITHUB_APP_ID=… GITHUB_WEBHOOK_SECRET=…`
# and `fly secrets set GITHUB_APP_PRIVATE_KEY="$(base64 < github-app.pem | tr -d '\n')"`.
# Admin CLI: `fly ssh console -c deploy/fly.toml -C "drikus help"`.
# Daily database snapshots go to /data/backups (BACKUP_KEEP, default 7); see README → Backups.
app = "drikus-cms"
primary_region = "ams"

[build]
  dockerfile = "../Dockerfile"

[env]
  PUBLIC_URL = "https://drikus-cms.fly.dev"
  TRUST_PROXY = "true"

[mounts]
  source = "drikus_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite lives on a single volume: run exactly one machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Room for resizing large photos (sharp decodes up to 80 megapixels).
  memory = "1024mb"
