# Synology (Container Manager → Project) or any Docker host.
# Put this file in e.g. /volume1/docker/drikus-cms and create a `data` folder next to it.
services:
  drikus-cms:
    image: ghcr.io/studioroor/drikus-cms:latest
    container_name: drikus-cms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUBLIC_URL: https://cms.example.com
      # The Synology reverse proxy (Login Portal → Advanced → Reverse Proxy) sets X-Forwarded-For.
      TRUST_PROXY: "true"
      # GitHub App: put the private key in ./data/github-app.pem.
      GITHUB_APP_ID: "123456"
      GITHUB_WEBHOOK_SECRET: "change-me"
      # Daily database snapshots in ./data/backups; add that folder to Hyper Backup.
      BACKUP_KEEP: "7"
    volumes:
      - ./data:/data
    # The app runs as uid 1000 and takes ownership of ./data on start. To keep
    # another owner instead, set `user: "<uid>:<gid>"` here.
